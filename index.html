<h1>Sémiologie chirurgicale — Version approfondie</h1><div class="s">4ᵉ année · Cours du Dr Lubin Evens · 8 chapitres · notes + schémas + QCM + cas</div>
<div class="bar"><i id="pb"></i></div><div class="s" id="sc"></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin:6px 0"><button onclick="cur=0;draw()">📚 Cours</button><button onclick="exam()">🎓 Mode examen</button><button onclick="rev()">🃏 Révision cartes</button></div><nav id="nav"></nav><div id="m"></div>
<script>
const C=[
{t:"1. Sémiologie, identification, anamnèse",x:`<h2>🔬 Approfondissement 1 : signe ou symptôme, comment trancher ?</h2><ul><li><b>Le patient décrit</b> ce qu'il voit et ressent : il peut décrire une masse (lipome, hernie, boule au cou, testicule plus gros) : c'est lui qui <i>voit</i> un signe, mais ce qu'il <i>ressent</i> (gêne, douleur, compression) reste un symptôme.</li><li><b>Le médecin découvre</b> le signe à l'examen : palpation de la masse, ictère, fièvre mesurée. Il le <i>confirme et le caractérise</i> (siège, consistance, taille).</li><li><b>Chirurgie</b> : les patients viennent souvent avec leurs signes (boule, masse). <b>Médecine interne/pédiatrie</b> : les yeux jaunes (ictère), le bébé jaune.</li><li>Règle d'or : <b>symptôme = subjectif, ressenti</b> ; <b>signe = objectif, observable, mesurable</b>. Le symptôme guide le médecin, le signe le confirme.</li></ul><h2>🔬 Approfondissement 2 : la consultation pas à pas</h2><ol><li><b>Se présenter</b> : « Bonsoir, je suis le Dr X, en quoi puis-je vous aider ? »</li><li><b>Identification</b> du patient.</li><li><b>Motif de consultation</b> (le plus souvent un symptôme : douleur, vomissements, diarrhée, céphalée, palpitations, vertige, asthénie, dyspnée).</li><li><b>Anamnèse</b> : histoire de la maladie actuelle (HMA), puis antécédents, habitudes.</li><li><b>Examen physique</b>, puis paraclinique, diagnostic, traitement.</li></ol><div class="k">Précision : la fiche d'identification sert aussi à établir la <b>relation médecin-patient</b>. Appeler le patient par son nom efface la distance : il se sent en confiance.</div><h2>🔬 Approfondissement 3 : pourquoi chaque élément d'identité compte</h2><div class="c"><b>Nom</b> : relation de confiance ; peut orienter l'origine géographique, donc certaines maladies liées à l'origine (ex. maladies plus fréquentes dans certaines populations). Ce n'est pas toujours vrai : à utiliser comme piste, pas comme preuve.</div><div class="c"><b>Âge</b> : facteur de risque. Même douleur : bénigne chez un jeune, à explorer (cancer ?) chez une personne de 65 ans. Pathologies pédiatriques et gériatriques ; <b>dosage des médicaments</b> (doses pédiatriques ≠ adultes).</div><div class="c"><b>Sexe biologique</b> : prostate, utérus, salpingite, grossesse ectopique. Chez une personne transgenre, on retient le <b>sexe biologique</b> pour le raisonnement médical (organes présents, ablation éventuelle, hormonothérapie).</div><div class="c"><b>Religion</b> : certaines pratiques modifient la prise en charge (Témoins de Jéhovah : pas de transfusion ; connaître la raison avant de transfuser).</div><div class="c"><b>Profession</b> : exposition (fumées de marché, bureau) et <b>moyens financiers</b> : prescrire un médicament que le patient peut acheter. Le <b>générique</b> peut coûter jusqu'à 10 fois moins cher que le produit de marque ; ne jamais promettre un succès thérapeutique garanti.</div><div class="c"><b>Adresse</b> : salubrité de la zone, condition socio-économique, risque infectieux.</div><div class="c"><b>Statut matrimonial / état civil</b> : célibataire, marié, conjoint, avec ou sans partenaires multiples → <b>risque d'infections sexuellement transmissibles</b> ; ne se confond pas avec le statut social. À consigner aussi : personne responsable, contact.</div><h2>🔬 Approfondissement 4 : l'anamnèse, la construction du récit</h2><ul><li><b>HMA</b> = histoire de la maladie actuelle (ce qui motive la consultation) ≠ histoire de la maladie (tout le passé médical). L'évolution se raconte <b>chronologiquement</b> : début (quand, comment), caractères des symptômes, ce qui a soulagé/aggravé, traitements pris, évolution jusqu'à aujourd'hui.</li><li><b>Écriture</b> : « Patient(e) de 32 ans, hypertendu(e) chronique, vu(e) pour douleur épigastrique d'installation brutale… » → âge, sexe, <b>statut pathologique</b> (chronique : hypertendu, diabétique, asthmatique, épileptique), puis le motif.</li><li><b>Patient chronique</b> : noter le traitement (médicament, dose, rythme, observance). Ex. hypertendu sous amlodipine, atenolol, enalapril, captopril…</li><li>Exemple : 80 ans, douleur épigastrique d'abord légère puis intense, vomissements bilieux (cf. caractériser le vomissement : contenu alimentaire/bilieux, quantité, nombre, horaire), douleur non calmée par le paracétamol, absence de fièvre → <b>caractéristiques chirurgicales</b> → demande d'avis.</li></ul><h2>🔬 Approfondissement 5 : antécédents et habitudes toxiques</h2><ul><li><b>Personnels pathologiques</b> : maladies passées/chroniques (si présents, noter ; sinon « aucun antécédent »).</li><li><b>Familiaux (hérédo-collatéraux)</b> : hypertension, diabète, cancers, asthme, épilepsie ; pour les infections (furoncle banal), peu utile.</li><li><b>Chirurgicaux</b> : date et type d'intervention. Très important : appendicectomie ancienne → douleur de la FID ne sera pas une appendicite ; pour une fosse iliaque droite chez la femme → salpingite, abcès tubo-ovarien…</li><li><b>Allergies</b> : médicaments, aliments ; risque de <b>réaction anaphylactique</b> : à demander avant toute prescription (très important).</li><li><b>Alcool</b> : douleur de l'HCD (foie), pancréatite, cancers, ulcère ; en chirurgie, aussi un risque anesthésique. Quantifier (verres/jour, ancienneté), distinguer occasionnel / social / quotidien.</li><li><b>Tabac</b> : type (cigarette, cigare, pipe, avec ou sans filtre), <b>quantité</b> (paquets/jour ; précision utile : paquets-années), maladies cardio-vasculaires. <b>Café</b> : nombre de tasses/jour. <b>Drogues</b> : héroïne, cocaïne, marijuana, ecstasy… à rechercher sans jugement.</li></ul>`,f:[["Différence signe / symptôme ?","Symptôme : subjectif, ressenti par le patient. Signe : objectif, observé, palpé ou mesuré par le médecin."],["Un patient vient pour une boule à la cuisse : c'est un signe ou un symptôme ?","La boule est un signe (même si c'est le patient qui l'a vue) ; la gêne ou la douleur qu'elle cause sont des symptômes."],["Qu'est-ce que le motif de consultation ?","Ce qui pousse le patient à consulter (symptôme ou signe)."],["Pourquoi l'âge est-il capital ?","Facteur de risque, pathologies pédiatriques/gériatriques, dosage des médicaments."],["Pourquoi le sexe biologique, même chez un patient transgenre ?","Parce que les organes et pathologies dépendent du sexe biologique (prostate, utérus, ovaires)."],["Pourquoi demander la profession ?","Exposition professionnelle et capacité d'acheter les médicaments (adapter la prescription, privilégier le générique)."],["Différence HMA / histoire de la maladie ?","HMA : l'évolution qui motive la consultation actuelle. Histoire de la maladie : tout le passé pathologique."],["Ordre des antécédents après la HMA ?","Personnels pathologiques → familiaux (hérédo) → chirurgicaux → allergies → habitudes toxiques."],["Pourquoi toujours demander les allergies ?","Pour éviter une réaction anaphylactique à un médicament prescrit."]],n:`<h2>Définitions</h2><ul><li><b>Sémiologie</b> : étude des signes et symptômes qui permettent de poser un diagnostic.</li><li><b>Symptôme</b> = subjectif, ressenti par le patient (douleur, nausée). <b>Signe</b> = objectif, observé/palpé/mesuré par le médecin (masse, ictère, fièvre).</li><li><b>Syndrome</b> = ensemble de signes + symptômes.</li><li><b>Motif de consultation</b> : ce qui pousse le patient à venir (douleur, vomissement, masse…). Un signe peut aussi être motif (lipome, ictère).</li></ul><div class="k">Piège : la masse que le patient « sent » est un signe qu'il décrit ; ce qu'il ressent autour (gêne, compression) est un symptôme.</div><h2>Fiche d'identification</h2><ul><li>Nom, prénom (relation médecin-patient, origine géographique), <b>âge</b> (facteur de risque, pathologies pédiatriques/gériatriques, dosage des médicaments), <b>sexe biologique</b> (prostate/utérus), religion (ex. Témoins de Jéhovah : pas de transfusion), profession (exposition, moyens d'acheter les médicaments), adresse (salubrité), <b>état civil</b> (activité sexuelle, risque), contact.</li></ul><h2>Anamnèse</h2><ul><li>Ordre : <b>histoire de la maladie actuelle</b> (chronologique : début, évolution, traitements) → antécédents personnels médicaux → <b>familiaux</b> (hérédité) → <b>chirurgicaux</b> (date, type) → <b>allergies</b> (réaction anaphylactique !) → habitudes toxiques (alcool, tabac, café, drogues).</li><li>Distinguer <i>histoire de la maladie</i> (passé) et <i>histoire de la maladie actuelle</i> (évolution).</li><li>Patient chronique : noter le traitement (nom, dose, rythme, observance).</li><li>Prescription : privilégier le générique si le patient n'a pas les moyens ; ne jamais promettre un succès thérapeutique.</li></ul>`,q:[["Quel élément est un SIGNE ?",["Nausée","Douleur","Ictère des conjonctives","Gêne"],2,"Le signe est objectif et observé par le médecin."],["Pourquoi connaître la religion du patient ?",["Pour le facturer","Certaines pratiques (transfusion) en dépendent","Pour son âge","Aucune raison"],1,"Ex. Témoins de Jéhovah et transfusion sanguine."],["Un patient opéré de l'appendice il y a 5 ans consulte pour douleur en FID. Que cherchez-vous ?",["Rien","Antécédent chirurgical : la cause n'est probablement pas une appendicite","Une allergie","Un diabète"],1,"On ne peut pas avoir d'appendicite si l'appendice a été retiré (sauf moignon) : d'où l'importance des ATCD chirurgicaux."],["Un patient écrit : « douleur en FID, appendicectomie il y a 3 ans ». Quel est votre réflexe ?",["Poser quand même appendicite","Chercher une autre cause (gynéco, urinaire, digestive)","Ignorer l'antécédent","Prescrire un antalgique"],1,"L'antécédent chirurgical change l'orientation diagnostique."],["Quel élément n'appartient PAS à la fiche d'identification ?",["Profession","Religion","Résultat de la lipase","Statut matrimonial"],2,"La lipase est un résultat paraclinique, pas une donnée d'identité."],["Pourquoi prescrire un générique à un patient aux moyens limités ?",["Il est moins efficace","Il peut coûter bien moins cher à principe actif identique","Pour changer de laboratoire","Aucune raison"],1,"On prescrit ce que le patient peut réellement acheter."],["Quelle donnée évoque un risque d'infection sexuellement transmissible ?",["Âge","Statut matrimonial et partenaires multiples","Nom","Adresse"],1,"État civil et vie sexuelle à explorer sans jugement."]],cas:["Patiente de 32 ans, hypertendue connue, vue pour douleur épigastrique. Comment ouvrez-vous l'observation ?",["Patiente de 32 ans, hypertendue chronique, vue pour douleur épigastrique","Madame hypertendue","Femme douloureuse","Épigastralgie"],0,"Âge, sexe (patiente), statut pathologique chronique, puis motif de consultation."]},
{t:"2. Étude de la douleur & anatomie de l'abdomen",x:`<h2>🔬 Approfondissement 1 : les 10 caractéristiques, une par une</h2><div class="c"><b>1 Siège</b> — « Où avez-vous mal ? » Il oriente vers l'organe, mais ce n'est qu'une <i>orientation</i> (une douleur peut être projetée).</div><div class="c"><b>2 Durée</b> — chronique ou aiguë/brutale ; depuis combien de temps ? La douleur brutale oriente vers l'urgence chirurgicale.</div><div class="c"><b>3 Intensité</b> — sévère/intense, modérée, légère. Elle guide le choix de l'antalgique. Précision : on la chiffre avec l'échelle 0–10 (EVA) ; en chirurgie, jamais d'antalgique avant l'évaluation du chirurgien.</div><div class="c"><b>4 Fréquence/périodicité</b> — certaines pathologies ont des crises périodiques (ulcère : crises de plusieurs semaines puis rémission ; colique : crises intermittentes).</div><div class="c"><b>5 Irradiation</b> — la douleur reste au point de départ <u>et</u> s'étend vers un autre point (2 points douloureux). Ex. colique hépatique → épaule droite ; pancréatite → dos.</div><div class="c"><b>6 Migration</b> — la douleur <u>quitte</u> un point pour aller à un autre. Ex. appendicite : épigastre → FID.</div><div class="k">Irradiation = j'ai mal ici <b>et</b> là. Migration = j'avais mal ici, <b>maintenant</b> c'est là.</div><div class="c"><b>7 Facteur déclenchant</b> — qu'est-ce qui l'a déclenchée ? Ex. un jeun prolongé → ulcère gastrique ; repas gras → colique hépatique ; alcool/repas copieux → pancréatite.</div><div class="c"><b>8 Circonstances de survenue</b> — au repos, à l'effort, la nuit, après un repas, après un traumatisme.</div><div class="c"><b>9 Facteurs aggravants / calmants</b> — ce qui l'aggrave (mouvement, repas) ; ce qui la calme (lait ou alimentation → ulcère ; antéflexion → pancréatite ; position antalgique → appendicite).</div><div class="c"><b>10 Signes accompagnateurs</b> — ensemble des signes qui accompagnent la douleur : fièvre, vomissements, ictère (douleur de l'HCD + yeux jaunes → foie), arrêt des gaz…</div><h2>🔬 Approfondissement 2 : types de douleur</h2><ul><li><b>Colique / crampe</b> : intermittente, qui va et vient (occlusion, colique).</li><li><b>Coup de poignard</b> : brutale, atroce, continue (perforation d'un organe creux).</li><li><b>Brûlure</b> : ulcère, reflux. <b>Pesanteur</b> : « un poids que le patient porte ».</li><li>Précisions : douleur en barre (pancréas), pulsatile/lancinante (abcès), en étau/constrictive (angor).</li><li><b>-dynie</b> = douleur (mastodynie, anodynie). Attention : <b>dysurie</b> ≠ -dynie (dysurie = miction difficile ou douloureuse).</li></ul><h2>🔬 Approfondissement 3 : l'abdomen à explorer — carte cliquable</h2><div class="s">Touche une région pour voir les organes qu'elle contient.</div><svg viewBox="0 0 300 190"><g stroke="currentColor" fill="var(--hl)" fill-opacity=".5" style="cursor:pointer"><rect x="30" y="10" width="80" height="56" data-o="<b>Hypocondre droit</b> : foie, vésicule biliaire, angle colique droit, partie du rein D"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="110" y="10" width="80" height="56" data-o="<b>Épigastre</b> : estomac, duodénum, pancréas, lobe gauche du foie"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="190" y="10" width="80" height="56" data-o="<b>Hypocondre gauche</b> : rate, queue du pancréas, angle colique gauche, estomac"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="30" y="66" width="80" height="57" data-o="<b>Flanc droit</b> : colon ascendant, rein droit, uretère"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="110" y="66" width="80" height="57" data-o="<b>Région ombilicale</b> : intestin grêle, mésentère, aorte abdominale"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="190" y="66" width="80" height="57" data-o="<b>Flanc gauche</b> : colon descendant, rein gauche"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="30" y="123" width="80" height="57" data-o="<b>Fosse iliaque droite</b> : caecum, appendice, annexe droite, uretère"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="110" y="123" width="80" height="57" data-o="<b>Hypogastre</b> : vessie, utérus, sigmoïde"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/><rect x="190" y="123" width="80" height="57" data-o="<b>Fosse iliaque gauche</b> : sigmoïde, annexe gauche"onclick="document.getElementById('rg').innerHTML=this.dataset.o"/></g><g font-size="10" text-anchor="middle" fill="currentColor" pointer-events="none"><text x="70" y="42">HCD</text><text x="150" y="42">Epig.</text><text x="230" y="42">HCG</text><text x="70" y="98">Flanc D</text><text x="150" y="98">Ombil.</text><text x="230" y="98">Flanc G</text><text x="70" y="155">FID</text><text x="150" y="155">Hypog.</text><text x="230" y="155">FIG</text></g></svg><div class="k" id="rg">Choisis une région.</div><ul><li>Tracé : 2 lignes horizontales + 2 verticales → 9 régions. Le diaphragme limite l'abdomen en haut.</li><li>Repères à connaître : ombilic, appendice xiphoïde, symphyse pubienne, ligne blanche (<i>linea alba</i>), épine iliaque antéro-supérieure, rebords costaux.</li><li>Précision : en pratique on utilise aussi les <b>4 quadrants</b> (ligne médiane + ligne passant par l'ombilic) : quadrant supérieur droit = voies biliaires, inférieur droit = appendice.</li><li><b>McBurney</b> : trait ombilic–épine iliaque antéro-supérieure droite, diviser en 3 : union du <b>tiers externe et des 2/3 internes</b>.</li></ul>`,f:[["Cite les 10 caractéristiques de la douleur.","Siège, durée, intensité, fréquence, irradiation, migration, facteur déclenchant, circonstances de survenue, facteurs aggravants/calmants, signes accompagnateurs (+ type)."],["Irradiation ou migration ? Douleur d'appendicite.","Migration (épigastre → FID)."],["Irradiation ou migration ? Colique hépatique.","Irradiation vers l'épaule droite."],["Facteur déclenchant de l'ulcère gastrique d'après le cours ?","Un jeuné prolongé (trop longtemps sans manger)."],["Quel type de douleur pour une perforation ?","Coup de poignard."],["Que signifie -dynie ?","Douleur (mastodynie = seins, anodynie = anus)."],["Quels sont les organes de la fosse iliaque droite ?","Caecum, appendice, annexe droite, uretère."],["Les 9 régions : cite-les.","Hypocondre D, épigastre, hypocondre G ; flanc D, ombilicale, flanc G ; FID, hypogastre, FIG."],["Où se situe McBurney ?","Entre le tiers externe et les 2/3 internes de la ligne ombilic–épine iliaque antéro-supérieure droite."]],n:`<h2>10 caractéristiques sémiologiques de la douleur</h2><ul><li><b>1 Siège</b> (orientation) · <b>2 Durée</b> (chronique/aiguë-brutale) · <b>3 Intensité</b> (sévère, modérée, légère → choix de l'antalgique) · <b>4 Fréquence/périodicité</b> · <b>5 Irradiation</b> (la douleur reste en place et s'étend ailleurs : 2 points) · <b>6 Migration</b> (la douleur quitte un point pour un autre, ex. appendicite) · <b>7 Facteur déclenchant</b> (jeûne prolongé → ulcère) · <b>8 Circonstances de survenue</b> · <b>9 Facteurs aggravants / calmants</b> · <b>10 Signes d'accompagnement</b> (ex. douleur de l'HCD + ictère → foie/voies biliaires).</li></ul><div class="k">Mnémo : S-D-I-F-I-M-F-C-A-S</div><h2>Types de douleur</h2><ul><li><b>Colique/crampe</b> (intermittente) · <b>coup de poignard</b> (perforation) · <b>brûlure</b> · <b>pesanteur</b>.</li><li>-<b>dynie</b> = douleur : mastodynie (seins), anodynie (anus).</li></ul><h2>Les 9 régions de l'abdomen</h2><svg viewBox="0 0 300 190" role="img" aria-label="9 régions"><g fill="none" stroke="currentColor"><rect x="30" y="10" width="240" height="170" rx="14"/><path d="M110 10v170M190 10v170M30 66h240M30 123h240"/></g><g font-size="11" text-anchor="middle" fill="currentColor"><text x="70" y="42">Hypocondre D</text><text x="150" y="42">Épigastre</text><text x="230" y="42">Hypocondre G</text><text x="70" y="98">Flanc D</text><text x="150" y="98">Ombilicale</text><text x="230" y="98">Flanc G</text><text x="70" y="155">Fosse iliaque D</text><text x="150" y="155">Hypogastre</text><text x="230" y="155">Fosse iliaque G</text></g></svg><ul><li>Repères : ombilic, appendice xiphoïde, symphyse pubienne, <b>ligne blanche (linea alba)</b>, épine iliaque antéro-supérieure, rebords costaux.</li><li><b>Point de McBurney</b> : union du tiers externe et des 2/3 internes de la ligne ombilic–épine iliaque antéro-supérieure → douleur = appendicite aiguë.</li></ul>`,q:[["Une douleur quitte l'épigastre et s'installe en FID : c'est…",["Une irradiation","Une migration","Une périodicité","Un facteur calmant"],1,"Migration = déplacement d'un point à un autre."],["Dysurie / mastodynie : le suffixe -dynie signifie…",["Saignement","Douleur","Inflammation","Masse"],1,"-dynie = douleur."],["Douleur de l'HCD + yeux jaunes : quel organe suspecter ?",["Estomac","Foie / voies biliaires","Appendice","Rate"],1,"Le signe d'accompagnement oriente vers le foie."],["Douleur qui reste au point de départ et s'étend ailleurs :",["Migration","Irradiation","Périodicité","Circonstance"],1,"Deux points douloureux simultanés."],["Quel organe se trouve dans l'hypocondre gauche ?",["Rate","Appendice","Vésicule","Vessie"],0,"Rate, queue du pancréas, angle colique gauche."],["Dysurie signifie :",["Douleur des seins","Miction difficile ou douloureuse","Douleur anale","Nausée"],1,"Ne pas confondre avec le suffixe -dynie."],["Douleur de pesanteur : le patient dit…",["« un poids que je porte »","« un coup de couteau »","« des crampes »","« une brûlure »"],0,"Type pesanteur."]],cas:["Un patient dit : « mon ventre me fait mal quand je jeûne longtemps, ça passe si je mange ». Quelle caractéristique + quelle piste ?",["Facteur déclenchant/calmant → ulcère","Migration → appendicite","Irradiation → pancréatite","Fréquence → colique néphrétique"],0,"Jeûne = facteur déclenchant, alimentation = calmant : ulcère (duodénal surtout)."]},
{t:"3. Abdomen aigu chirurgical & 4 syndromes",x:`<h2>🔬 Approfondissement 1 : de la consultation à la douleur chirurgicale</h2><ul><li><b>Motifs de consultation</b> variés : douleur, hémorragie, diarrhée, vomissement, éruption cutanée, céphalée, infertilité, perte d'appétit, perte de l'odorat, dyspnée, brûlures mictionnelles… Certains sont plus fréquents, d'autres plus graves. La <b>douleur</b> est le motif le plus rencontré ; c'est un <b>symptôme</b>.</li></ul><div class="c"><b>5 scénarios possibles pour un patient qui vient pour douleur</b><ol><li>Interrogé, <b>renvoyé sans médicaments</b> avec des conseils (ex. douleur à la gorge).</li><li>Interrogé, <b>médicaments prescrits sans examens</b> : environ 95 % des diagnostics sont cliniques (ex. douleur d'une contusion).</li><li>Vu, interrogé, puis <b>observé aux urgences</b> quelques heures, puis renvoyé.</li><li>Interrogé, <b>hospitalisation</b> recommandée, bilan puis traitement.</li><li><b>Pris en charge en salle d'opération</b> puis rémission complète : c'est la <b>douleur chirurgicale</b>.</li></ol></div><div class="k">Douleur chirurgicale : <b>ne pas donner de médicaments</b> avant l'évaluation du chirurgien. Si elle est localisée à l'abdomen : <b>abdomen aigu chirurgical</b>.</div><h2>🔬 Approfondissement 2 : les causes classées par syndrome</h2><div class="c"><b>Péritonéal</b> : appendicite aiguë, cholécystite aiguë, ulcère perforé, salpingite, abcès tubo-ovarien, diverticulite, pancréatite.</div><div class="c"><b>Occlusif</b> : occlusion sur bride, invagination intestinale, volvulus, hernie étranglée.</div><div class="c"><b>Hémorragique</b> : grossesse ectopique rompue, rupture de rate, kyste ovarien rompu, traumatisme abdominal.</div><div class="c"><b>Mixte / ischémique</b> : volvulus, hernie étranglée, infarctus mésentérique, kyste ovarien tordu (occlusion + ischémie + inflammation). « Occlusion = obstruction = obstacle. »</div><h2>🔬 Approfondissement 3 : détails des signes</h2><ul><li><b>Syndrome péritonéal</b> : douleur intense et continue, fièvre, tachycardie, signes d'infection, <b>réaction péritonéale</b> (ventre dur à la palpation, douloureux à la décompression).</li><li><b>Syndrome occlusif</b> : douleur <b>de type colique</b> (intermittente, intense, non continue), distension, vomissements, <b>arrêt des gaz et des matières</b>.</li><li><b>Syndrome hémorragique</b> : douleur intense et continue, contracture, <b>pâleur conjonctivale</b>, tachycardie, <b>pouls filant</b> (mal perçu), extrémités froides, sueurs profuses, hypotension. Précision : le sang est un produit chimique <b>irritant</b> pour le péritoine, sauf dans les vaisseaux.</li><li>Tachycardie + tension basse = signe d'alarme (choc).</li></ul><h2>🎮 Exerce-toi : identifie le syndrome</h2><div class="s">Coche les signes d'un patient : le syndrome probable s'affiche.</div><div class="c"><label style="display:block"><input type="checkbox" class="sg" data-s="P" onchange="ch()"> Fièvre</label><label style="display:block"><input type="checkbox" class="sg" data-s="PH" onchange="ch()"> Contracture / rebond</label><label style="display:block"><input type="checkbox" class="sg" data-s="PH" onchange="ch()"> Tachycardie</label><label style="display:block"><input type="checkbox" class="sg" data-s="PH" onchange="ch()"> Douleur intense continue</label><label style="display:block"><input type="checkbox" class="sg" data-s="O" onchange="ch()"> Douleur colique intermittente</label><label style="display:block"><input type="checkbox" class="sg" data-s="O" onchange="ch()"> Distension abdominale</label><label style="display:block"><input type="checkbox" class="sg" data-s="OP" onchange="ch()"> Vomissements</label><label style="display:block"><input type="checkbox" class="sg" data-s="OP" onchange="ch()"> Arrêt des gaz et des matières</label><label style="display:block"><input type="checkbox" class="sg" data-s="H" onchange="ch()"> Pâleur des conjonctives</label><label style="display:block"><input type="checkbox" class="sg" data-s="H" onchange="ch()"> Extrémités froides, sueurs</label><label style="display:block"><input type="checkbox" class="sg" data-s="H" onchange="ch()"> Hypotension</label><div class="k" id="sy">Coche des signes.</div></div>`,f:[["Définis l'abdomen aigu chirurgical.","Douleur localisée à l'abdomen, d'apparition brutale, par une pathologie nécessitant une intervention chirurgicale urgente."],["Pourquoi ne pas donner d'antalgique ?","Cela masque les signes et retarde le diagnostic ; on attend l'évaluation du chirurgien."],["Les 4 syndromes ?","Péritonéal, occlusif, hémorragique, mixte/ischémique."],["Triade de l'occlusion ?","Douleur colique, vomissements, arrêt des gaz et des matières (+ distension)."],["Signes de l'hémorragie interne ?","Pâleur conjonctivale, tachycardie, pouls filant, extrémités froides, sueurs, hypotension."],["Pourquoi le sang irrite-t-il le péritoine ?","Le sang est irritant en dehors des vaisseaux : il provoque contracture et réaction péritonéale."],["Quelle cause chez une femme en âge de procréer avec douleur + choc ?","Grossesse ectopique rompue (syndrome hémorragique)."],["Cite 5 abdomens aigus chirurgicaux.","Appendicite, ulcère perforé, GEU rompue, cholécystite, occlusion sur bride (aussi rupture de rate, hernie étranglée, volvulus)."]],n:`<h2>Principe</h2><ul><li>Douleur qui nécessite un avis chirurgical : <b>ne pas donner d'antalgiques avant l'évaluation du chirurgien</b> (masque les signes).</li><li><b>Abdomen aigu chirurgical</b> = douleur <b>localisée</b> à l'abdomen + <b>apparition brutale</b> + pathologie nécessitant une <b>intervention urgente</b>.</li><li>Exemples : appendicite aiguë, ulcère perforé, grossesse ectopique rompue, cholécystite aiguë, occlusion sur bride, rupture de rate, hernie étranglée, volvulus, invagination, kyste ovarien tordu, abcès tubo-ovarien, salpingite, pancréatite.</li></ul><h2>4 syndromes</h2><div class="c"><b>1 Péritonéal</b> (« abdomen aigu infecté ») : douleur intense continue, fièvre, tachycardie, signes d'infection, réaction péritonéale (contracture, défense, rebond).</div><div class="c"><b>2 Occlusif</b> : douleur colique (intermittente), distension abdominale, vomissements, <b>arrêt des gaz et des matières</b>.</div><div class="c"><b>3 Hémorragique</b> : douleur intense continue, contracture, pâleur des conjonctives, tachycardie, pouls filant, extrémités froides, sueurs profuses, hypotension.</div><div class="c"><b>4 Mixte / ischémique</b> : associe les signes des trois (occlusion + ischémie + péritonite).</div>`,q:[["Arrêt des gaz et des matières + vomissements + douleur colique :",["Syndrome péritonéal","Syndrome occlusif","Syndrome hémorragique","Aucun"],1,"Triade de l'occlusion."],["Pâleur conjonctivale, extrémités froides, tachycardie, sueurs :",["Hémorragique","Occlusif","Péritonéal","Mixte"],0,"Tableau de choc hémorragique."],["Devant un abdomen aigu, on…",["Donne un antalgique puissant","Attend l'évaluation du chirurgien","Renvoie à domicile","Donne un purgatif"],1,"Les antalgiques masquent la clinique."],["Hernie étranglée : quel syndrome probable ?",["Occlusif, souvent mixte avec ischémie","Hormonal","Respiratoire","Aucun"],0,"Obstruction + strangulation vasculaire = tableau mixte."],["Quel signe oriente vers un choc hémorragique ?",["Fièvre élevée","Extrémités froides et pouls filant","Diarrhée","Toux"],1,"Signes de défaillance circulatoire."],["Sur 100 diagnostics, environ combien sont cliniques selon le cours ?",["5","25","50","95"],3,"D'où l'importance de l'interrogatoire et de l'examen."],["Douleur colique = douleur…",["Continue","Intermittente, par crises","Absente","Seulement nocturne"],1,"Type occlusif."]],cas:["Femme de 25 ans, douleur brutale de la FID, malaise, tachycardie, pâleur, test de grossesse positif. Quel syndrome et quelle hypothèse ?",["Hémorragique – grossesse ectopique rompue","Occlusif – bride","Péritonéal – gastrite","Mixte – colique"],0,"Hémorragie interne chez une femme en âge de procréer : GEU rompue jusqu'à preuve du contraire."]},
{t:"4. Syndrome péritonéal & péritonites",x:`<h2>🔬 Approfondissement 1 : le péritoine</h2><ul><li>Séreuse en 2 feuillets : <b>pariétal</b> (tapisse la paroi) et <b>viscéral</b> (recouvre les organes), délimitant la <b>cavité péritonéale</b>.</li><li>Précision : le péritoine pariétal est riche en fibres sensitives (douleur <b>précise</b>, localisée, contracture) ; le viscéral donne une douleur <b>vague, mal localisée</b> (d'où la douleur appendiculaire d'abord épigastrique puis en FID).</li><li>Le péritoine s'enflamme → il <b>réagit</b> → contracture + réaction péritonéale (rebond).</li></ul><h2>🔬 Approfondissement 2 : les 3 familles de signes</h2><div class="c"><b>Fonctionnels</b> (dysfonctionnement du tube digestif) : douleur, vomissements, <b>arrêt des gaz et des matières</b> (iléus réflexe : le péristaltisme des anses est inhibé, plus de progression du contenu intestinal).</div><div class="c"><b>Généraux</b> (retentissement sur l'organisme) : fièvre, tachycardie, signes de déshydratation.</div><div class="c"><b>Physiques</b> (examen) : contracture, douleur à la palpation, rebond (+ silence auscultatoire).</div><div class="k">Ne pas confondre : arrêt des gaz par <b>iléus paralytique</b> (péritonite, pas d'obstacle) et par <b>occlusion mécanique</b> (obstacle). Dans le doute, c'est l'examen et l'imagerie qui tranchent.</div><h2>🔬 Approfondissement 3 : la contracture et le rebond, comprendre pour retenir</h2><ul><li>Respiration = diaphragme + poumons + <b>paroi abdominale</b>. Quand le péritoine est enflammé, chaque mouvement respiratoire de l'abdomen <b>augmente la douleur</b>.</li><li>L'organisme <b>contracte les muscles abdominaux</b> pour immobiliser la paroi et calmer la douleur : c'est la <b>contracture</b>, moyen de défense. Le patient reste couché en position antalgique (immobile).</li><li><b>Rebond</b> : le médecin déprime lentement la paroi puis relâche <b>brusquement</b> → douleur déclenchée par la décompression brusque (réaction péritonéale).</li></ul><h2>🔬 Approfondissement 4 : le 3ᵉ secteur, étape par étape (clique pour dérouler)</h2><details class="c"><summary><b>① Le péritoine s'enflamme</b> — que fait-il ?</summary><div class="k">Il sécrète du liquide dans la cavité péritonéale.</div></details><details class="c"><summary><b>② Les anses</b> — que deviennent-elles ?</summary><div class="k">Elles se dilatent et du liquide s'accumule dans leur lumière : 3ᵉ secteur (ni intravasculaire, ni interstitiel, ni cellulaire).</div></details><details class="c"><summary><b>③ Le volume circulant</b> — conséquence ?</summary><div class="k">Hypovolémie : ↓ du volume sanguin → tachycardie, hypotension.</div></details><details class="c"><summary><b>④ Le rein</b> — conséquence ?</summary><div class="k">Moins de sang vers les reins → ↓ filtration glomérulaire → urines concentrées → <b>oligurie</b>.</div></details><details class="c"><summary><b>⑤ Signes visibles</b></summary><div class="k">Déshydratation : lèvres sèches, soif, pli cutané. Traitement : réanimation (rééquilibration hydro-électrolytique).</div></details><h2>🔬 Approfondissement 5 : les 3 péritonites comparées</h2><table style="width:100%;font-size:14px;border-collapse:collapse"><tr><th></th><th>Primaire</th><th>Secondaire</th><th>Tertiaire</th></tr><tr><td><b>Cause</b></td><td>Extra-abdominale</td><td>Affection abdominale</td><td>Secondaire mal traitée / persistante</td></tr><tr><td><b>Terrain</b></td><td>Âges extrêmes, immunodéprimés</td><td>Sujet jeune</td><td>Immunodéprimé, multi-opéré</td></tr><tr><td><b>Évolution</b></td><td>Rapide, fulminante</td><td>Progressive</td><td>Prolongée</td></tr><tr><td><b>Fréquence</b></td><td>Rare</td><td>~90 %</td><td>Rare</td></tr><tr><td><b>Germes</b></td><td>Habituels</td><td>Habituels</td><td>Inhabituels (mycoses, champignons, virus)</td></tr></table><ul><li><b>Primaire</b> : immunodéficience (malnutrition, diabète, cancer, infection virale). Précisions : cirrhose avec ascite, syndrome néphrotique de l'enfant.</li><li><b>Secondaire</b> : origine <u>gynécologique</u> (femme) ou non ; par <b>diffusion</b> de proximité (organe malade contamine le péritoine) ou par <b>perforation</b> (le contenu se déverse dans la cavité). Causes inflammatoires : appendicite, cholécystite, diverticulite, pancréatite, salpingite, Crohn. Causes perforatives : perforation typhique, traumatisme, ulcère perforé.</li><li><b>Tertiaire</b> : la cause initiale n'est plus là mais la péritonite persiste ; patient opéré plusieurs fois (relaparotomies).</li></ul><h2>🔬 Conduite à tenir (précisions)</h2><ul><li>Réanimation (voie veineuse, rééquilibration, antibiothérapie), bilan, imagerie → <b>chirurgie</b> : traitement de la cause (appendicectomie, suture d'ulcère…) + lavage de la cavité péritonéale.</li></ul>`,f:[["Quels sont les 2 signes péritonéaux ?","La contracture et la réaction péritonéale (rebond)."],["Pourquoi la contracture ?","Les muscles abdominaux se contractent pour limiter la respiration abdominale et calmer la douleur (moyen de défense)."],["Technique du rebond ?","Déprimer lentement la paroi puis relâcher brusquement : douleur due à la décompression brusque."],["Définis le 3ᵉ secteur.","Distribution d'eau hors des secteurs intracellulaire, intravasculaire et interstitiel (ascite, hémopéritoine, liquide dans les anses)."],["Pourquoi une oligurie en péritonite ?","↓ volume → ↓ perfusion rénale → ↓ filtration glomérulaire → urines concentrées."],["Pourquoi les gaz et matières s'arrêtent-ils ?","Iléus réflexe : inhibition du péristaltisme des anses."],["Péritonite primaire : 3 mots.","Cause extra-abdominale, âges extrêmes, immunodéficience (tableau fulminant)."],["Quelle péritonite est la plus fréquente et laquelle est mal traitée ?","Secondaire (~90 %) ; la tertiaire est la secondaire mal traitée/persistante."]],n:`<h2>Mécanisme</h2><ul><li>Organe atteint : le <b>péritoine</b> (inflammation) → il réagit : <b>contracture</b> (défense) + <b>réaction péritonéale (rebond)</b>. Ces <b>2 signes péritonéaux</b> définissent le syndrome.</li><li><b>Contracture</b> : contraction des muscles abdominaux pour limiter la respiration abdominale et calmer la douleur. Le patient adopte la <b>position antalgique</b>.</li><li><b>Rebond</b> : douleur due à la décompression brusque de la paroi.</li><li>Signes <b>fonctionnels</b> (douleur, vomissements, arrêt des gaz) · <b>généraux</b> (fièvre, tachycardie) · <b>physiques</b> (contracture, rebond).</li></ul><h2>Le 3ᵉ secteur</h2><ul><li>Eau corporelle : intracellulaire + extracellulaire (intravasculaire + interstitiel). Une distribution d'eau hors de ces secteurs = <b>3ᵉ secteur</b> (ascite, hémothorax, hémopéritoine, liquide dans les anses).</li><li>Conséquences : hypovolémie → ↓ filtration glomérulaire → <b>oligurie</b> + déshydratation (lèvres sèches).</li><li>Péritonite : <b>iléus réflexe</b> (anses paralysées) → arrêt des gaz et des matières « par paralysie ».</li></ul><h2>Classification</h2><ul><li><b>Primaire</b> : cause extra-abdominale, extrêmes d'âge (bébé, vieillard), immunodéprimés, tableau fulminant.</li><li><b>Secondaire</b> (~90 %, la plus fréquente) : à une affection abdominale, évolution progressive, sujet jeune. Causes : inflammatoires (appendicite, cholécystite, diverticulite, pancréatite, salpingite, Crohn), <b>perforatives</b> (typhique, traumatique, ulcère perforé). Par diffusion ou par perforation.</li><li><b>Tertiaire</b> : péritonite secondaire mal traitée ou persistante, immunodéficience, multi-opérés, germes inhabituels (mycoses, champignons, virus).</li></ul><div class="k">Appendicite = cause n°1 de syndrome péritonéal (organe étroit, cul-de-sac, riche en bactéries, lymphoïde).</div>`,q:[["Les 2 signes péritonéaux sont…",["Fièvre et tachycardie","Contracture et réaction péritonéale","Douleur et vomissement","Ictère et ascite"],1,"Définition du syndrome péritonéal."],["Péritonite sur ulcère perforé : laquelle ?",["Primaire","Secondaire","Tertiaire","Aucune"],1,"Secondaire à une affection abdominale."],["Pourquoi une oligurie en péritonite ?",["Atteinte rénale primitive","3ᵉ secteur → hypovolémie → ↓ filtration glomérulaire","Déshydratation sans cause","Rétention de gaz"],1,"Le liquide séquestré réduit le volume circulant."],["La contracture est…",["Un signe de défense de l'organisme","Un signe d'allergie","Un signe tardif de guérison","Un signe occlusif"],0,"Elle limite la participation de l'abdomen à la respiration."],["Quel est le germe type d'une péritonite tertiaire ?",["Germes habituels","Germes inhabituels (mycoses, champignons, virus)","Aucun germe","Seulement des parasites"],1,"Terrain immunodéprimé, patient multi-opéré."],["Arrêt des gaz au cours d'une péritonite :",["Obstacle mécanique","Iléus réflexe","Diarrhée","Hernie"],1,"Pas d'obstacle : inhibition du péristaltisme."],["Le péritoine pariétal donne une douleur…",["Vague","Précise et localisée","Jamais de douleur","Seulement nocturne"],1,"D'où la migration vers la FID dans l'appendicite."]],cas:["Patient de 70 ans immunodéprimé, tableau septique fulminant, aucune cause abdominale retrouvée. Type de péritonite ?",["Primaire","Secondaire","Tertiaire","Chimique"],0,"Cause extra-abdominale + âge extrême + immunodépression = primaire."]},
{t:"5. Appendicite aiguë",x:`<h2>🔬 Approfondissement : formes cliniques selon la position de l'appendice</h2><div class="c"><b>Rétrocaecale</b> : douleur lombaire droite, FID peu douloureuse, <b>signe du psoas +</b> (cuisse fléchie), signes urinaires possibles. Examen abdominal pauvre.</div><div class="c"><b>Pelvienne</b> : douleur hypogastrique, <b>signes urinaires</b> (pollakiurie, dysurie) et <b>rectaux</b> (ténesme, diarrhée) ; <b>toucher rectal : cri du Douglas</b> ; signe de l'obturateur +.</div><div class="c"><b>Sous-hépatique</b> (caecum haut) : douleur de l'HCD, confusion avec cholécystite. <b>Méso-cœliaque</b> : douleur péri-ombilicale, tableau subocclusif.</div><div class="c"><b>Terrains particuliers</b> : enfant et sujet âgé → diagnostic tardif, perforation plus fréquente, signes atypiques ; femme enceinte → douleur remontée, douleur plus haute.</div><h2>Diagnostics différentiels (à éliminer)</h2><ul><li><b>Urologique</b> : colique néphrétique droite (irradiation génitale, hématurie).</li><li><b>Gynécologique</b> : salpingite, grossesse ectopique, kyste ovarien tordu, douleur d'ovulation → toujours un test de grossesse chez la femme.</li><li><b>Digestif</b> : adénolymphite mésentérique (enfant, post-ORL), maladie de Crohn, diverticule de Meckel, gastro-entérite, cholécystite si caecum haut.</li></ul><h2>Complications</h2><ul><li><b>Plastron appendiculaire</b> (masse de la FID, accolement des anses) · <b>abcès</b> · <b>péritonite</b> généralisée (appendicite perforée, contracture, iléus) · pyléphlébite (rare).</li></ul><h2>Score d'Alvarado (MANTRELS) — précision complémentaire</h2><div class="k"><b>M</b>igration (1) · <b>A</b>norexie (1) · <b>N</b>ausées/vomissements (1) · <b>T</b>enderness FID (2) · <b>R</b>ebond (1) · <b>E</b>lévation T° (1) · <b>L</b>eucocytose (2) · <b>S</b>hift à gauche (1). Total /10 : ≥ 7 = appendicite probable.</div><h2>Conduite à tenir</h2><ul><li>Cas de chirurgie : <b>pas d'antalgique avant l'avis du chirurgien</b>, patient à jeun, voie veineuse, bilan (NFS, CRP, β-hCG), écho ± scanner si doute → <b>appendicectomie</b> + antibiothérapie.</li></ul>`,f:[["Quel est le mécanisme initial de l'appendicite ?","Obstruction de la lumière (fécalithe, parasite, corps étranger, tumeur) → stase → multiplication des germes → gaz → ↑ pression → distension."],["Pourquoi la douleur débute-t-elle à l'épigastre ?","La distension de la paroi stimule les fibres viscérales (plexus solaire) : douleur épigastrique/péri-ombilicale, mal localisée."],["Pourquoi migre-t-elle en FID ?","L'inflammation atteint le péritoine pariétal, innervé de façon somatique : douleur précise en FID, maximale à McBurney (≥ 6 h)."],["Définis le signe de Blumberg.","Douleur provoquée par la décompression brusque de la FID (réaction péritonéale, rebond)."],["Définis Rovsing et explique-le.","Compression de la FIG → douleur en FID : le gaz est refoulé vers le caecum, ↑ de la pression intraluminale/pariétale."],["Signe de Lenander ?","T° rectale supérieure de 1 à 1,5 °C à la T° axillaire."],["Signe du psoas / de l'obturateur : utilité ?","Psoas : appendice rétrocaecal (extension de la cuisse douloureuse). Obturateur : appendice pelvien (rotation interne de la cuisse fléchie)."],["Fièvre en appendicite non compliquée ?","Fébricule ≤ 38,5 °. Fièvre élevée = penser abcès ou péritonite."]],n:`<h2>Rappel anatomique</h2><ul><li>Petit organe appendu au <b>caecum</b>, très long, <b>cul-de-sac</b> à lumière étroite, paroi lymphoïde (« amygdale de l'abdomen »).</li><li>Physiopathologie : <b>obstruction</b> de la lumière (fécalithe = petite selle dure, parasite, corps étranger, tumeur) → stase → multiplication des germes → gaz → ↑ pression → distension.</li><li>Distension → douleur <b>épigastrique/péri-ombilicale</b> (plexus solaire), puis irritation du péritoine pariétal → douleur en <b>FID</b>.</li></ul><h2>Clinique</h2><div class="k"><b>Douleur appendiculaire</b> : début épigastrique, modérée → <b>migration en FID après ≥ 6 h</b>, maximale au <b>point de McBurney</b>. Signes associés : nausées/vomissements, <b>fébricule ≤ 38,5 °</b>, perte d'appétit. Facteur déclenchant inconnu ; calmant : position antalgique (chien de fusil).</div><h2>Examen physique : signes à retenir</h2><ul><li><b>Inspection</b> : abdomen qui respire mal (respiration limitée) ; signe de Sharpmann.</li><li><b>Palpation</b> : <b>McBurney</b> (douleur), <b>Blumberg</b> (rebond en FID, + ↑ à la décompression), <b>Rovsing</b> (compression de la FIG → douleur en FID par refoulement des gaz), <b>Lenander</b> (T° rectale > T° axillaire de 1 à 1,5 °C), <b>signe du psoas</b>, <b>signe de l'obturateur</b>, <b>Douglas</b> (TR : cri du Douglas, douleur vive du cul-de-sac), <b>Horn</b> (traction du cordon spermatique → douleur en FID).</li><li><b>Percussion</b> : signe de Holmann (douleur à la percussion de la FID).</li><li><b>Auscultation</b> : bruits hydro-aériques normaux ; <b>silence auscultatoire</b> si péritonite avancée (iléus).</li><li><b>Paraclinique</b> : GB ↑ (hyperleucocytose), CRP ↑, Hb normale. L'échographie / scanner confirme.</li></ul><div class="k">Une appendicite à McBurney : « le signe négatif n'existe pas » — on ne dit jamais « McBurney négatif ».</div><h2>Évolution</h2><ul><li>Non traitée : abcès → <b>péritonite</b> (appendicite perforée). Traitement : <b>appendicectomie</b> urgente.</li></ul>`,q:[["Début typique de la douleur appendiculaire :",["FID d'emblée","Épigastrique/péri-ombilicale puis migration en FID","HCD","Hypogastre"],1,"Migration après ≥ 6 h."],["Signe de Rovsing :",["Rebond en FID","Compression FIG → douleur FID","Cri du Douglas","Douleur à la traction du cordon"],1,"Le gaz refoulé distend le caecum."],["Fièvre d'une appendicite non compliquée :",["40 °","Fébricule ≤ 38,5 °","Aucune jamais","Hypothermie"],1,"Fièvre forte = penser à une complication."],["Pourquoi l'appendice est-il l'« amygdale de l'abdomen » ?",["Il est rouge","Il est lymphoïde et répond aux infections","Il produit la bile","Il est dans la gorge"],1,"Tissu lymphoïde → inflammation facile."],["Appendice pelvien : quel signe au toucher rectal ?",["Cri du Douglas","Rebond en HCD","Murphy","Courvoisier"],0,"Le cul-de-sac de Douglas est douloureux."],["Quel diagnostic différentiel gynécologique doit-on toujours écarter chez la femme en âge de procréer ?",["Gastrite","Grossesse ectopique","Hernie hiatale","Pancréatite"],1,"Test β-hCG systématique."],["Un score d'Alvarado ≥ 7 signifie…",["Appendicite improbable","Appendicite probable","Péritonite certaine","Aucune conclusion"],1,"Le seuil ≥ 7 oriente vers une appendicite probable."]],cas:["Jeune de 19 ans : douleur épigastrique depuis 8 h, nausées, T° 38 °, puis douleur intense en FID, McBurney +, Blumberg +. Diagnostic et conduite ?",["Gastrite : antiacide","Appendicite aiguë : avis chirurgical, appendicectomie, pas d'antalgique avant évaluation","Colique néphrétique : antispasmodique","Gastro-entérite : réhydratation"],1,"Migration + McBurney + Blumberg + fébricule = appendicite aiguë."]},
{t:"6. Examen de l'abdomen & voies biliaires",x:`<h2>🔬 Approfondissement 1 : la paroi abdominale et l'inspection</h2><ul><li><b>Muscles de la paroi</b> : grands droits (de part et d'autre de la <b>ligne blanche</b>), obliques externe et interne, transverse, pyramidal. Les fibres s'entrecroisent et se rejoignent sur la ligne médiane : le <b>tonus musculaire</b> des deux côtés s'équilibre (F1 = F2).</li><li><b>Inspection</b> : abdomen plat, ballonné ou distendu ? Cicatrices (antécédents chirurgicaux) ? Suit-il les mouvements respiratoires ? Asymétrie ? Circulation collatérale ?</li><li>En péritonite, l'abdomen <b>ne suit plus la respiration</b> (contracture) ; en appendicite, la FID peut être moins mobile.</li></ul><h2>🔬 Approfondissement 2 : anatomie des voies biliaires</h2><ul><li><b>Bile</b> : produite par les <b>hépatocytes</b>, émulsifie les graisses. Voies <b>intra-hépatiques</b> (canalicules → canaux hépatiques droit et gauche) puis <b>extra-hépatiques</b>.</li><li>Trajet : canal hépatique D + G → <b>canal hépatique commun</b> → rejoint le <b>canal cystique</b> (vésicule biliaire = réservoir) → <b>cholédoque</b> → s'unit au canal de <b>Wirsung</b> (pancréas) dans l'<b>ampoule de Vater</b> (hépato-pancréatique) → <b>sphincter d'Oddi</b> → 2ᵉ portion du duodénum (grande caroncule).</li><li><b>Pédicule portal</b> (3 éléments) : branche de la veine porte, branche de l'artère hépatique, canal biliaire.</li><li><b>Foie : 8 segments</b> (Couinaud), chacun avec son propre pédicule : I lobe caudé · II latéral supérieur G · III latéral inférieur G · IV médial G (partie sup. et inf.) · V antérieur inférieur D · VI postérieur inférieur D · VII postérieur supérieur D · VIII antérieur supérieur D.</li></ul><h2>🔬 Approfondissement 3 : physiopathologie de la douleur biliaire</h2><div class="k">La douleur biliaire est due à la <b>mise sous tension</b> (distension) des voies biliaires par une <b>augmentation de la pression intra-luminale</b>, presque toujours par un obstacle (calcul). Le repas gras libère la <b>cholécystokinine</b> : la vésicule se contracte contre un calcul enclavé → crise.</div><h2>🔬 Approfondissement 4 : lithiase, colique, cholécystite, angiocholite</h2><ul><li><b>Lithiase</b> : formation de calculs (cholestérol surtout) ; souvent <b>asymptomatique</b>. Terrain : <i>Female, Forty, Fat, Fertile</i>.</li><li><b>Colique hépatique</b> : douleur de l'HCD/épigastre, brutale, intense, spasmodique, à début <b>nocturne ou post-prandial</b>, irradiation <b>scapulaire D</b>, nausées/vomissements, <b>2–4 h</b>, jamais > 6 h. <b>Pas de fièvre, pas d'ictère, biologie normale</b>.</li><li><b>Cholécystite aiguë</b> : colique non résolue (&gt; 6 h) + fièvre 38–38,5 °, tachycardie, subictère, <b>Murphy +</b>, hyperleucocytose, CRP ↑. Technique du Murphy : patient en décubitus dorsal, main de l'examinateur sous le rebord costal droit, inspiration profonde → <b>arrêt brutal de l'inspiration</b> par la douleur. Complications : gangrène, <b>perforation → péritonite biliaire</b>, plastron vésiculaire.</li><li><b>Angiocholite</b> (infection de la voie biliaire principale, calcul du cholédoque) : <b>triade de Charcot</b> = douleur + <b>fièvre-frissons</b> + <b>ictère</b>. Précision : si hypotension + confusion s'ajoutent = <b>pentade de Reynolds</b> (choc septique, urgence de drainage). Biologie : bilirubine, PAL, γGT ↑, GB ↑.</li><li><b>Loi de Courvoisier-Terrier</b> : ictère + <b>grosse vésicule indolore</b> → obstacle <u>tumoral</u> (cancer de la tête du pancréas). Obstacle <u>lithiasique</u> → vésicule <b>scléro-atrophique</b> (rétractée).</li></ul><h2>🔬 Approfondissement 5 : paraclinique</h2><ul><li><b>Échographie</b> : examen de choix (calcul = image hyperéchogène avec cône d'ombre, paroi &gt; 3 mm, vésicule distendue, dilatation des voies biliaires).</li><li>Biologie : NFS (GB ↑), CRP, bilan hépatique (bilirubine, PAL, γGT, transaminases), lipase si doute pancréatique.</li><li>Radiographie debout (thorax/ASP) : hémogramme + croissant gazeux si perforation ; Hb normale ou ↓.</li></ul>`,f:[["Cite le trajet de la bile, du foie au duodénum.","Hépatocytes → canaux hépatiques D/G → hépatique commun → (cystique ↔ vésicule) → cholédoque → ampoule de Vater (sphincter d'Oddi, + Wirsung) → 2ᵉ portion du duodénum."],["Quels sont les 3 éléments du pédicule portal ?","Branche de la veine porte, branche de l'artère hépatique, canal biliaire."],["Combien de segments hépatiques et quel est le segment I ?","8 segments (Couinaud) ; le segment I = lobe caudé."],["Pourquoi un repas gras déclenche-t-il la colique ?","Libération de CCK → contraction de la vésicule → calcul enclavé → ↑ pression intra-luminale."],["Caractéristiques de la colique hépatique ?","HCD/épigastre, brutale, irradiation scapulaire D, nausées, 2–4 h (jamais > 6 h), sans fièvre ni ictère."],["Technique et sens du signe de Murphy ?","Main sous le rebord costal D, inspiration profonde : arrêt de l'inspiration → cholécystite aiguë."],["Triade de Charcot et pentade de Reynolds ?","Charcot : douleur, fièvre-frissons, ictère. Reynolds : + hypotension + confusion."],["Loi de Courvoisier-Terrier ?","Ictère + grosse vésicule indolore = cause tumorale ; lithiase = vésicule rétractée."],["Quel examen de choix pour la vésicule ?","L'échographie abdominale."]],n:`<h2>Examen de l'abdomen : 4 étapes</h2><div class="k"><b>I</b>nspection → <b>P</b>alpation → <b>P</b>ercussion → <b>A</b>uscultation (INPAPEAU… ordre : I-Pa-Pe-A). Le patient en décubitus dorsal, détendu, jambes fléchies.</div><ul><li>Inspection : forme, respiration, cicatrices, distension, circulation collatérale.</li><li>Palpation douce puis profonde, en terminant par la zone douloureuse.</li><li>Percussion : matité préhépatique normale ; <b>disparition = pneumopéritoine (signe de Jaubert)</b>.</li><li>Auscultation : <b>silence auscultatoire</b> = iléus réflexe.</li></ul><h2>Voies biliaires</h2><ul><li>Voie biliaire intra-hépatique → canaux hépatiques droit/gauche → <b>canal hépatique commun</b> + canal cystique (vésicule) → <b>cholédoque</b> → ampoule de Vater (sphincter d'Oddi) → duodénum.</li><li>Foie : 8 segments (Couinaud). Pédicule : artère hépatique, veine porte, voie biliaire.</li><li>Douleur biliaire = <b>HCD / épigastre</b>, irradie à l'omoplate/épaule droite, déclenchée par repas gras.</li></ul><h2>Pathologies</h2><div class="c"><b>Lithiase biliaire</b> (calcul : <i>lithos</i> = pierre) : la plus fréquente. Femme, 4F : <i>Fat, Female, Forty, Fertile</i> (30–40 ans).</div><div class="c"><b>Colique hépatique</b> : douleur brutale, très violente, HCD/épigastre, nocturne ou après repas gras, irradiation scapulaire droite, nausées/vomissements, durée 2–4 h (jamais > 6 h), <b>sans fièvre ni ictère</b>. Écho : calcul.</div><div class="c"><b>Cholécystite aiguë</b> : colique non résolue → fièvre 38–38,5 °, tachycardie, subictère, vomissements, <b>signe de Murphy</b> (arrêt de l'inspiration à la palpation de l'HCD). Écho : vésicule distendue, paroi épaissie, calcul, GB ↑ CRP ↑.</div><div class="c"><b>Angiocholite</b> = <b>triade de Charcot</b> : douleur + fièvre/frissons + ictère. Urgence chirurgicale/endoscopique (drainage).</div><div class="k">Loi de Courvoisier-Terrier : ictère + grosse vésicule indolore → cancer de la tête du pancréas (≠ lithiase).</div>`,q:[["Murphy positif signifie…",["Rebond en FID","Arrêt de l'inspiration à la palpation de l'HCD","Matité préhépatique","Douleur lombaire"],1,"Signe de cholécystite."],["Triade de Charcot :",["Douleur, fièvre/frissons, ictère","Douleur, vomissements, diarrhée","Fièvre, toux, dyspnée","Ictère, ascite, splénomégalie"],0,"Angiocholite."],["Colique hépatique typique :",["Fièvre 39 °, ictère","Douleur HCD < 6 h, sans fièvre ni ictère","Douleur FID","Diarrhée sanglante"],1,"Fièvre = complication (cholécystite)."],["Examen de choix en cas de cholécystite :",["Radio du thorax","Échographie","ASP","Transit baryté"],1,"Écho abdominale."],["Le canal cystique relie…",["Foie et duodénum","Vésicule et canal hépatique commun","Pancréas et duodénum","Estomac et foie"],1,"La jonction cystique + hépatique commun forme le cholédoque."],["Fièvre + frissons + ictère + douleur de l'HCD :",["Colique hépatique","Angiocholite","Ulcère","Appendicite"],1,"Triade de Charcot ; si choc et confusion = Reynolds."],["Ictère avec grosse vésicule indolore :",["Lithiase du cholédoque","Obstacle tumoral (Courvoisier)","Cholécystite","Pancréatite"],1,"Une lithiase donnerait plutôt une vésicule rétractée."],["Le segment hépatique VII est…",["Postérieur supérieur droit","Antérieur inférieur droit","Lobe caudé","Médial gauche"],0,"Segments V–VIII = foie droit."]],cas:["Femme de 38 ans en surpoids : douleur de l'HCD depuis 8 h après un repas gras, fièvre 38,3 °, Murphy +, GB ↑. Diagnostic ?",["Colique hépatique simple","Cholécystite aiguë","Appendicite","Pancréatite"],1,"Colique persistante > 6 h + fièvre + Murphy = cholécystite aiguë."]},
{t:"7. Pancréatite aiguë",x:`<h2>🔬 Approfondissement 1 : anatomie et fonctions du pancréas</h2><div class="s">Touche une partie du schéma.</div><svg viewBox="0 0 300 120"><g stroke="currentColor" fill="var(--hl)" style="cursor:pointer"><circle cx="65" cy="72" r="28" data-o="<b>Tête</b> : dans la concavité du duodénum, au contact du cholédoque. Cancer de la tête → ictère." onclick="document.getElementById('pg').innerHTML=this.dataset.o"/><ellipse cx="112" cy="62" rx="22" ry="14" data-o="<b>Col</b> : zone étroite entre tête et corps, en avant de la veine porte." onclick="document.getElementById('pg').innerHTML=this.dataset.o"/><ellipse cx="170" cy="50" rx="42" ry="14" data-o="<b>Corps</b> : oblique, en arrière de l'estomac (arrière-cavité des épiploons), région épigastrique." onclick="document.getElementById('pg').innerHTML=this.dataset.o"/><ellipse cx="240" cy="36" rx="30" ry="12" data-o="<b>Queue</b> : vers la rate (hypocondre gauche)." onclick="document.getElementById('pg').innerHTML=this.dataset.o"/></g><path d="M240 36Q165 50 70 74" fill="none" stroke="currentColor" stroke-dasharray="4"/><g font-size="10" text-anchor="middle" fill="currentColor" pointer-events="none"><text x="65" y="76">Tête</text><text x="112" y="90">Col</text><text x="170" y="30">Corps</text><text x="240" y="18">Queue</text></g></svg><div class="k" id="pg">Wirsung (canal principal, pointillé) rejoint le cholédoque dans l'ampoule de Vater ; canal accessoire = Santorini.</div><ul><li><b>Glande mixte</b> : <b>exocrine</b> (enzymes digestives : lipase, amylase) + <b>endocrine</b> (îlots de Langerhans : insuline β, glucagon α).</li><li>Les enzymes sont sécrétées en <b>pro-enzymes inactives</b>, activées dans le duodénum. Insuffisance exocrine → <b>stéatorrhée</b> (selles grasses). Insuffisance endocrine → <b>diabète</b>.</li></ul><h2>🔬 Approfondissement 2 : physiopathologie</h2><div class="k">Pancréatite aiguë = enzymes <b>activées dans le pancréas</b> → <b>autodigestion</b> pouvant aller à la nécrose totale (pas seulement une inflammation).</div><ul><li><b>Lithiase biliaire</b> (1ʳᵉ cause) : calcul bloqué à la <b>confluence cholédoco-wirsungienne</b> → reflux bilio-pancréatique → activation des enzymes.</li><li><b>Alcool</b> (2ᵉ cause), <b>hypertriglycéridémie</b>, certains <b>médicaments</b>.</li><li>Toutes les pathologies du pancréas sont graves.</li></ul><h2>🔬 Approfondissement 3 : la douleur et son contexte</h2><ul><li><b>Siège</b> : épigastrique ou ombilical, médian, parfois à gauche, rarement à droite. <b>Type</b> : en barre, transfixiante. <b>Intensité</b> : très forte, résistante aux antalgiques usuels.</li><li><b>Irradiation</b> : dorsale (transfixiante), parfois flanc gauche. <b>Calmant</b> : antéflexion (chien de fusil). <b>Jamais soulagée par l'alimentation</b> (le repas stimule la sécrétion pancréatique et aggrave).</li><li><b>Déclenchant</b> : repas copieux, alcool. <b>Signes associés</b> : nausées, vomissements répétés (risque de <b>Mallory-Weiss</b> : déchirure de la muqueuse gastro-œsophagienne, sang rouge vif), distension (iléus réflexe), tachycardie.</li></ul><h2>🔬 Approfondissement 4 : examen et signes de gravité</h2><ul><li><b>Dissociation</b> : signes fonctionnels et généraux riches, examen physique pauvre (ventre souple, pas de contracture franche). Peut évoluer en syndrome mixte (inflammation + iléus + hémorragie).</li><li><b>Cullen</b> : ecchymose péri-ombilicale. <b>Grey-Turner</b> : ecchymose du flanc/lombaire (hémorragie rétropéritonéale par action des enzymes). Plus visibles sur peau claire.</li><li>Les 3 catastrophes intra-abdominales : <b>thrombose mésentérique, volvulus du sigmoïde, pancréatite nécrotico-hémorragique</b>.</li><li>Diagnostics différentiels de la douleur épigastrique : <b>infarctus du myocarde</b> (faire un ECG), dissection/rupture d'anévrisme aortique, ulcère perforé, occlusion.</li></ul><h2>🔬 Approfondissement 5 : paraclinique et prise en charge</h2><ul><li><b>Lipase</b> : plus spécifique, reste élevée plus longtemps ; <b>> 3 × la normale</b> = diagnostic. Amylase : moins spécifique (glandes salivaires, intestin). Une pancréatite peut exister avec enzymes normales ; toute pathologie pancréatique peut en élever le taux.</li><li>Marqueurs tumoraux (CA 19-9) : ininterprétables en cas de cholestase.</li><li>Écho (lithiase, voies biliaires), <b>scanner</b> (nécrose), glycémie, calcémie, CRP, bilan hépatique.</li><li>Traitement : médical en milieu hospitalier (jeûne, réhydratation, antalgiques, traitement de la cause) ; chirurgie/endoscopie si nécrose infectée ou lithiase.</li></ul>`,f:[["Les 2 fonctions du pancréas ?","Exocrine (enzymes digestives) et endocrine (insuline, glucagon : îlots de Langerhans)."],["Pourquoi les enzymes sont-elles sécrétées inactives ?","Pro-enzymes activées seulement dans le duodénum pour éviter l'autodigestion."],["Mécanisme de la pancréatite aiguë ?","Activation des enzymes dans le pancréas → autodigestion → nécrose possible."],["Les 2 causes principales ?","Lithiase biliaire puis alcool (aussi hypertriglycéridémie, médicaments)."],["Douleur typique ?","Épigastrique en barre, irradiation dorsale, calmée par l'antéflexion, jamais par l'alimentation."],["Cullen vs Grey-Turner ?","Cullen : péri-ombilical. Grey-Turner : flanc/lombaire."],["Seuil diagnostique de la lipase ?","> 3 × la valeur normale."],["Pourquoi la lipase plutôt que l'amylase ?","Elle est plus spécifique du pancréas."],["Dissociation clinique ?","Symptômes riches (douleur intense, vomissements), examen physique pauvre (souple)."]],n:`<h2>Rappel</h2><ul><li>Pancréas : organe rétro-péritonéal, <b>glande mixte</b> : exocrine (enzymes digestives : amylase, lipase) + endocrine (insuline, glucagon).</li><li>Enzymes sécrétées sous forme inactive (<b>pro-enzymes</b>) : activées dans le duodénum. Pancréatite = <b>auto-digestion</b>. Causes principales : <b>lithiase biliaire</b> (1ʳᵉ cause) et <b>alcool</b> ; aussi hypertriglycéridémie, médicaments.</li></ul><h2>Clinique</h2><div class="k"><b>Douleur pancréatique typique</b> : épigastrique (ou ombilicale), « <b>en barre</b> », brutale, <b>très intense</b>, irradiation <b>dorsale</b> transfixiante, <b>calmée par l'antéflexion</b> (chien de fusil), non calmée par antalgiques usuels, vomissements fréquents. Facteurs déclenchants : repas copieux, alcool.</div><ul><li><b>Dissociation</b> : douleur très intense mais <b>examen physique pauvre</b> ; contracture rare (≠ appendicite/ulcère perforé).</li><li><b>3 catastrophes</b> à connaître : thrombose mésentérique, volvulus du sigmoïde, pancréatite nécrotique/hémorragique.</li><li>Signes de nécrose hémorragique : <b>Cullen</b> (ecchymose péri-ombilicale) et <b>Grey-Turner</b> (ecchymose du flanc).</li></ul><h2>Paraclinique</h2><ul><li><b>Lipase</b> (plus spécifique, reste élevée plus longtemps) et amylase : diagnostic si <b>lipase > 3 × la normale</b>.</li><li>Écho/TDM : taille, nécrose, lithiase. Glycémie, calcémie, CRP.</li></ul>`,q:[["Douleur typique de la pancréatite :",["En barre, irradiation dorsale, calmée par l'antéflexion","FID, migratrice","HCD, scapulaire","Hypogastre, colique"],0,"Position en chien de fusil."],["Marqueur le plus spécifique :",["Amylase","Lipase","Glycémie","Hb"],1,"Lipase > 3 × N."],["Signe de Cullen :",["Ecchymose du flanc","Ecchymose péri-ombilicale","Ictère","Rebond"],1,"Grey-Turner = flanc."],["1ʳᵉ cause de pancréatite aiguë (selon le cours) :",["Lithiase biliaire","Traumatisme","Virus","Diabète"],0,"Puis alcool."],["Quel organe est atteint dans l'insuffisance pancréatique endocrine ?",["Îlots de Langerhans → diabète","Foie","Rate","Estomac"],0,"Insuline/glucagon."],["Quelle pathologie doit-on éliminer devant toute douleur épigastrique aiguë ?",["Rhume","Infarctus du myocarde","Entorse","Otite"],1,"Faire un ECG."],["Mallory-Weiss est :",["Une déchirure muqueuse par vomissements répétés","Une tumeur","Un calcul","Une hernie"],0,"Hématémèse de sang rouge vif."],["Le canal de Wirsung est :",["Le canal principal du pancréas","Le cystique","Le cholédoque","Un canal rénal"],0,"Il rejoint le cholédoque dans l'ampoule de Vater."]],cas:["Homme de 45 ans, alcoolique, douleur épigastrique en barre irradiant au dos, vomissements, ventre souple. Lipase × 5. Diagnostic ?",["Ulcère perforé","Pancréatite aiguë","Appendicite","Occlusion"],1,"Douleur intense + examen pauvre + lipase > 3 N."]},
{t:"8. Ulcère gastro-duodénal & perforation",x:`<h2>🔬 Approfondissement 1 : la paroi digestive et la profondeur de la lésion</h2><div class="s">Touche une couche pour voir ce qui se passe quand l'ulcère l'atteint.</div><svg viewBox="0 0 300 130"><g stroke="currentColor" fill="var(--hl)" style="cursor:pointer"><rect x="20" y="10" width="260" height="24" data-o="<b>1 Muqueuse</b> : atteinte isolée = érosion / gastrite (inflammation). La douleur s'aggrave souvent au repas." onclick="document.getElementById('ug').innerHTML=this.dataset.o"/><rect x="20" y="34" width="260" height="24" data-o="<b>2 Sous-muqueuse</b> : début de l'ulcère (perte de substance) ; vaisseaux proches, risque hémorragique (hématémèse, méléna)." onclick="document.getElementById('ug').innerHTML=this.dataset.o"/><rect x="20" y="58" width="260" height="30" data-o="<b>3 Musculeuse</b> : ulcère creusant, douleur plus intense et périodique ; cicatrice possible, risque de sténose." onclick="document.getElementById('ug').innerHTML=this.dataset.o"/><rect x="20" y="88" width="260" height="24" data-o="<b>4 Séreuse</b> : traversée = <b>perforation</b> → contenu gastrique dans la cavité péritonéale → péritonite (ulcère perforé)." onclick="document.getElementById('ug').innerHTML=this.dataset.o"/></g><g font-size="11" text-anchor="middle" fill="currentColor" pointer-events="none"><text x="150" y="26">Muqueuse</text><text x="150" y="50">Sous-muqueuse</text><text x="150" y="77">Musculeuse</text><text x="150" y="104">Séreuse</text></g></svg><div class="k" id="ug">Ulcère = perte de substance qui atteint la muqueuse, puis la sous-muqueuse, la musculeuse, jusqu'à la séreuse.</div><h2>🔬 Approfondissement 2 : ulcère gastrique ou duodénal, gastrite ?</h2><ul><li><b>Deux pathologies complètement différentes</b> : ulcère gastrique (estomac) et ulcère duodénal (duodénum).</li><li><b>Duodénal</b> : plutôt sujet jeune, douleur à jeun/nocturne, <b>calmée par l'alimentation</b> (aliments, alcalins, lait). <b>Gastrique</b> : plutôt sujet âgé, douleur souvent après le repas, <b>risque de lésion précancéreuse</b> (biopsie systématique).</li><li><b>Gastrite</b> (inflammation) : le repas irrite et la douleur augmente. <b>Ulcère</b> (plaie remplie d'acide chlorhydrique) : le repas protège la plaie et calme la douleur.</li><li>Causes : <i>Helicobacter pylori</i>, AINS, alcool, tabac, mauvaises habitudes alimentaires, stress. <b>Facteurs déclenchants</b> : jeûne prolongé, aliments acides (pH réduit), épices, alcool, AINS.</li><li>Signes associés : vomissements, <b>hématémèse</b>, <b>méléna</b>, pyrosis, régurgitation.</li></ul><h2>🔬 Approfondissement 3 : explorations</h2><ul><li><b>Fibroscopie œso-gastro-duodénale</b> (endoscopie digestive haute) : examen de référence, voit l'aspect de la muqueuse et caractérise l'ulcère ; <b>biopsies</b> (H. pylori, cancer).</li><li><b>Transit œso-gastro-duodénal (repas baryté)</b> : examen radiologique avec produit de contraste (baryum) pour étudier l'œsophage, l'estomac, le duodénum. Indications : reflux, hernie hiatale, ulcère, sténose, tumeur, troubles de déglutition. Technique : patient à jeun, il boit le baryum, clichés/radioscopie sous plusieurs angles.</li><li><b>Image d'addition</b> (niche) : le baryum comble la perte de substance = ulcère. <b>Image de soustraction</b> (lacune) : le baryum contourne une masse = tumeur.</li><li>Traitement : arrêt AINS/alcool/tabac ; éradication de H. pylori (IPP + antibiotiques).</li></ul><h2>🔬 Approfondissement 4 : ulcère perforé, clinique complète</h2><div class="k">Pendant la perforation, la lésion traverse toute l'épaisseur de la paroi : l'estomac contient du <b>liquide (HCl)</b>, de l'<b>air</b> et des <b>débris alimentaires</b> qui se déversent dans la cavité péritonéale.</div><ul><li><b>Antécédents</b> : douleurs ulcéreuses, pyrosis, AINS, alcool, tabac.</li><li><b>Début</b> : douleur épigastrique en coup de poignard, atroce, d'emblée maximale, qui diffuse à tout l'abdomen ; position antalgique (immobile, parfois antéflexion).</li><li><b>Aspect général</b> : anxieux, facies crispé, sueurs, pâleur des muqueuses, extrémités froides, tachycardie ; signes de choc possibles ; fièvre tardive.</li><li><b>Abdomen</b> : ne suit pas la respiration, contracture généralisée (ventre de bois), rebond.</li><li><b>Percussion</b> : matité préhépatique normale du 5ᵉ espace intercostal au rebord costal ; en cas de perforation, l'air s'interpose entre foie et paroi (patient debout) : <b>diminution/disparition de la matité = signe de Jaubert = pneumopéritoine</b>.</li><li><b>Auscultation</b> : silence auscultatoire (iléus réflexe).</li><li><b>Biologie</b> : Hb normale ou ↓, hyperleucocytose. <b>Radio thorax/ASP debout</b> : <b>croissant gazeux sous-diaphragmatique</b> (air libre entre foie et diaphragme).</li><li>Conduite : réanimation, voie veineuse, <b>chirurgie urgente</b> (suture/épiploplastie) + IPP + antibiotiques.</li></ul>`,f:[["Définis l'ulcère.","Perte de substance de la muqueuse gastrique ou duodénale pouvant atteindre sous-muqueuse, musculeuse et séreuse."],["Rythme de la douleur de l'ulcère duodénal ?","Douleur à jeun/nocturne, calmée par l'alimentation."],["Gastrite vs ulcère : effet du repas ?","Gastrite : douleur augmente ; ulcère duodénal : douleur calmée."],["Examen de référence ?","Fibroscopie œso-gastro-duodénale avec biopsies."],["Image d'addition / de soustraction ?","Addition : niche = ulcère. Soustraction : lacune = tumeur."],["Douleur de la perforation ?","Coup de poignard épigastrique, brutale, diffusant à tout l'abdomen."],["Signe de Jaubert ?","Diminution ou disparition de la matité préhépatique = pneumopéritoine."],["Image radiologique de la perforation ?","Croissant gazeux sous-diaphragmatique (air libre)."],["Contenu qui se déverse en perforation ?","Liquide (HCl), air, débris alimentaires → péritonite."]],n:`<h2>Définition</h2><ul><li>Ulcère = perte de substance de la muqueuse gastrique ou duodénale pouvant atteindre la sous-muqueuse puis la musculeuse.</li><li>4 couches de l'estomac : muqueuse, sous-muqueuse, musculeuse, séreuse.</li><li>Causes : <b><i>Helicobacter pylori</i></b>, AINS, alcool, tabac, stress, épices ; acide chlorhydrique (HCl).</li></ul><h2>Douleur ulcéreuse</h2><div class="k"><b>Siège</b> épigastrique · <b>type</b> brûlure/crampe · intensité modérée à intense · <b>périodicité</b> (par crises) · rythme : <b>duodénal</b> = douleur à jeun, calmée par l'alimentation (« faim douloureuse ») ; <b>gastrique</b> = douleur après les repas (aggravée par l'alimentation).</div><ul><li>Signes associés : vomissements, hématémèse, <b>méléna</b>. Complications : hémorragie, <b>perforation</b>, sténose.</li><li>Exploration : <b>fibroscopie</b> (endoscopie) = examen de référence ; transit baryté (image d'addition = niche ; image de soustraction = tumeur).</li></ul><h2>Ulcère perforé</h2><ul><li><b>Douleur en coup de poignard</b> épigastrique, brutale, atroce, puis diffusion à tout l'abdomen.</li><li>Patient immobile, anxieux, pâle, sueurs, tachycardie. <b>Contracture généralisée = « ventre de bois »</b>, rebond.</li><li>Percussion : <b>disparition de la matité préhépatique</b> (signe de Jaubert) = <b>pneumopéritoine</b>.</li><li>Radiographie debout (thorax/ASP) : <b>croissant gazeux sous-diaphragmatique</b>. Auscultation : silence (iléus).</li><li>Traitement : chirurgie urgente (suture/épiploplastie) + IPP.</li></ul>`,q:[["Douleur à jeun, calmée par un repas :",["Ulcère gastrique","Ulcère duodénal","Pancréatite","Cholécystite"],1,"Rythme duodénal."],["Disparition de la matité préhépatique :",["Ascite","Pneumopéritoine (Jaubert)","Hépatomégalie","Normal"],1,"Air libre entre foie et paroi."],["Image radiologique de la perforation :",["Niveau hydro-aérique","Croissant gazeux sous-diaphragmatique","Calcul","Double bulle"],1,"Pneumopéritoine."],["Examen de référence de l'ulcère :",["Fibroscopie","Échographie","Scanner uniquement","ASP"],0,"Visualise la lésion et permet la biopsie (H. pylori)."],["L'image d'addition au transit baryté correspond à…",["Une tumeur","Une niche ulcéreuse","Un calcul","Un reflux"],1,"Le baryum comble la perte de substance."],["Le signe de Jaubert est…",["Cullen","Disparition de la matité préhépatique","Murphy","Rovsing"],1,"Pneumopéritoine."],["Quelle couche, une fois traversée, définit la perforation ?",["Muqueuse","Sous-muqueuse","Musculeuse","Séreuse"],3,"La séreuse est la 4ᵉ et dernière couche."],["Ulcère perforé : la conduite est…",["Antalgique et domicile","Chirurgie urgente + réanimation","Régime seul","Surveillance 1 semaine"],1,"Péritonite par perforation = urgence."]],cas:["Homme de 50 ans, sous AINS, douleur épigastrique brutale « en coup de poignard », ventre de bois, matité préhépatique absente. Conduite ?",["Antispasmodique à domicile","ASP/radio debout puis laparotomie/chirurgie urgente + réanimation","Fibroscopie à distance","Antiacide seul"],1,"Ulcère perforé : urgence chirurgicale, radiographie pour confirmer l'air libre."]}
];

function nav(){const n=document.getElementById('nav');n.innerHTML='';C.forEach((c,i)=>{const b=document.createElement('button');b.textContent=i+1;b.title=c.t;b.className=i==cur?'on':'';b.onclick=()=>{cur=i;draw()};n.appendChild(b)})}
function item(k,x,i,cas){const d=document.createElement('div');d.className='c';d.innerHTML=(cas?'<b>🩺 Cas clinique</b><br>':'')+'<b>'+x[0]+'</b>';x[1].forEach((o,j)=>{const b=document.createElement('button');b.className='o';b.textContent=o;b.onclick=()=>{if(S[k]!=null)return;S[k]=j==x[2];[...d.querySelectorAll('.o')].forEach((e,z)=>{e.className='o '+(z==x[2]?'ok':z==j?'ko':'')});d.querySelector('.e').style.display='block';upd()};d.appendChild(b)});const e=document.createElement('div');e.className='e';e.innerHTML='✅ <b>'+x[1][x[2]]+'</b> — '+x[3];d.appendChild(e);return d}
function ch(){let s={P:0,O:0,H:0};document.querySelectorAll('.sg:checked').forEach(e=>{for(const l of e.dataset.s)s[l]++});const n={P:'péritonéal',O:'occlusif',H:'hémorragique'};let a=Object.entries(s).sort((x,y)=>y[1]-x[1]);document.getElementById('sy').innerHTML=a[0][1]==0?'Coche des signes.':(a.filter(z=>z[1]>=3).length>1?'<b>Tableau mixte</b> (plusieurs syndromes associés) — ':'Syndrome le plus probable : <b>'+n[a[0][0]]+'</b> — ')+a.map(z=>n[z[0]]+' '+z[1]).join(' · ')}
function upd(){const t=C.reduce((a,c)=>a+c.q.length+1,0),k=Object.keys(S).length,r=Object.values(S).filter(v=>v).length;document.getElementById('pb').style.width=100*k/t+'%';document.getElementById('sc').textContent='Réponses : '+k+'/'+t+' · Bonnes : '+r}
function draw(){nav();const c=C[cur];m.innerHTML='<h2 style="font-size:19px;margin-top:6px">'+c.t+'</h2>'+c.n+(c.x||'')+(c.f?'<h2>🃏 Rappel actif — réponds dans ta tête, puis clique</h2>'+c.f.map(a=>'<details class="c"><summary><b>'+a[0]+'</b></summary><div class="k">'+a[1]+'</div></details>').join(''):'')+'<h2>🧠 QCM</h2>';c.q.forEach((x,i)=>m.appendChild(item(cur+'q'+i,x,i)));m.appendChild(item(cur+'c',[c.cas[0],c.cas[1],c.cas[2],c.cas[3]],0,1));const f=document.createElement('div');f.style.cssText='display:flex;gap:8px;margin:14px 0';f.innerHTML='<button onclick="cur=Math.max(0,cur-1);draw();scrollTo(0,0)">← Précédent</button><button onclick="cur=Math.min(C.length-1,cur+1);draw();scrollTo(0,0)">Suivant →</button>';m.appendChild(f);upd()}
function shuf(a){return a.sort(()=>Math.random()-.5)}
function exam(){let P=[];C.forEach((c,i)=>c.q.forEach(x=>P.push([i,x])));P=shuf(P).slice(0,20);let k=0,sc=0,ch={};function go(){if(k>=P.length){m.innerHTML='<h2>Résultat : '+sc+'/'+P.length+'</h2>'+Object.entries(ch).map(e=>'<div class="c">Chapitre '+(+e[0]+1)+' : '+e[1][0]+'/'+e[1][1]+(e[1][0]<e[1][1]?' → à retravailler':' ✅')+'</div>').join('')+'<button onclick="exam()">Recommencer</button>';return}const [i,x]=P[k];m.innerHTML='<div class="s">Question '+(k+1)+'/'+P.length+' · 20 questions tirées des 8 chapitres</div>';const d=document.createElement('div');d.className='c';d.innerHTML='<b>'+x[0]+'</b>';let lock=0;x[1].forEach((o,j)=>{const b=document.createElement('button');b.className='o';b.textContent=o;b.onclick=()=>{if(lock)return;lock=1;ch[i]=ch[i]||[0,0];ch[i][1]++;if(j==x[2]){sc++;ch[i][0]++}[...d.querySelectorAll('.o')].forEach((e,z)=>e.className='o '+(z==x[2]?'ok':z==j?'ko':''));const e=document.createElement('div');e.style.marginTop='6px';e.innerHTML='✅ <b>'+x[1][x[2]]+'</b> — '+x[3]+'<br>';const n=document.createElement('button');n.textContent='Suivant →';n.onclick=()=>{k++;go()};e.appendChild(n);d.appendChild(e)};d.appendChild(b)});m.appendChild(d)}go()}
function rev(){let F=[];C.forEach((c,i)=>(c.f||[]).forEach(a=>F.push([i,a])));F=shuf(F);let k=0;function go(){if(k>=F.length){m.innerHTML='<h2>Révision terminée 🎉</h2><button onclick="rev()">Recommencer</button>';return}const [i,a]=F[k];m.innerHTML='<div class="s">Carte '+(k+1)+'/'+F.length+' · Chapitre '+(i+1)+' · les cartes ratées reviennent</div><div class="c"><b>'+a[0]+'</b></div><button id="sh">Voir la réponse</button><div id="an"></div>';document.getElementById('sh').onclick=()=>{document.getElementById('an').innerHTML='<div class="k">'+a[1]+'</div><button id="ok">Je savais ✅</button> <button id="no">À revoir ❌</button>';const nx=g=>{if(!g)F.push(F[k]);k++;go()};document.getElementById('ok').onclick=()=>nx(1);document.getElementById('no').onclick=()=>nx(0)}}go()}

draw();
</script></body></html>
